
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فروشگاه عاطفه</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial;background:#f7f4fa;color:#292333}
header{background:linear-gradient(120deg,#7029a5,#b64bc0);color:white;padding:25px 16px;text-align:center}
header h1{margin:0 0 10px;font-size:30px}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:10px;padding:12px 17px;cursor:pointer;font-weight:bold}
nav button{background:white;color:#742a99}
main{max-width:1000px;margin:25px auto;padding:0 14px}
.search{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:20px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.card{background:white;border-radius:16px;padding:17px;box-shadow:0 3px 14px #00000010}
.pic{height:125px;background:#f2e4f8;border-radius:12px;display:grid;place-items:center;font-size:52px}
.card h3{margin-bottom:8px}
.price{color:#852caa;font-weight:bold}
.card button,.primary{background:#812ba5;color:white;margin-top:10px;width:100%}
.panel{background:white;border-radius:16px;padding:20px;margin:20px 0;box-shadow:0 3px 14px #00000010}
input{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
.hidden{display:none}
.item{padding:12px 0;border-bottom:1px solid #eee}
.danger{background:#ffe5e5;color:#a22}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header>
<h1>💜 فروشگاه عاطفه</h1>
<p>خرید آسان، سریع و مطمئن</p>
<nav>
<button onclick="show('home')">صفحه اصلی</button>
<button onclick="show('cart')">🛒 سبد خرید (<span id="count">0</span>)</button>
<button onclick="show('login')">مدیریت فروشگاه</button>
</nav>
</header>

<main>
<section id="home">
<h2>✨ محصولات فروشگاه</h2>
<input class="search" id="search" placeholder="دنبال چه محصولی می‌گردی؟" oninput="render()">
<div class="products" id="products"></div>
</section>

<section id="cart" class="hidden">
<div class="panel">
<h2>🛒 سبد خرید</h2>
<div id="cartItems"></div>
<h3 id="total">مبلغ کل: ۰ تومان</h3>
<input id="customer" placeholder="نام و نام خانوادگی">
<input id="phone" placeholder="شماره تماس">
<input id="address" placeholder="آدرس تحویل سفارش">
<button class="primary" onclick="order()">ثبت سفارش</button>
</div>
</section>

<section id="login" class="hidden">
<div class="panel">
<h2>🔐 ورود مدیر</h2>
<input id="pass" type="password" placeholder="رمز مدیریت">
<button class="primary" onclick="login()">ورود</button>
<p id="error" style="color:red"></p>
</div>
</section>

<section id="admin" class="hidden">
<div class="panel">
<h2>⚙️ پنل مدیریت</h2>
<h3>افزودن محصول</h3>
<input id="pname" placeholder="نام محصول">
<input id="pprice" type="number" placeholder="قیمت به تومان">
<input id="pemoji" placeholder="ایموجی محصول، مثلا 👟">
<button class="primary" onclick="addProduct()">افزودن محصول</button>
</div>
<div class="panel">
<h3>مدیریت محصولات</h3>
<div id="adminProducts"></div>
</div>
<div class="panel">
<h3>📦 سفارش‌های ثبت شده</h3>
<div id="orders"></div>
</div>
<button class="danger" onclick="logout()">خروج از مدیریت</button>
</section>
</main>

<footer>فروشگاه عاطفه 💜</footer>

<script>
const defaultProducts=[
{id:1,name:"کیف زیبا",price:450000,emoji:"👜"},
{id:2,name:"کفش اسپرت",price:850000,emoji:"👟"},
{id:3,name:"ساعت شیک",price:620000,emoji:"⌚"},
{id:4,name:"هدفون",price:390000,emoji:"🎧"},
{id:5,name:"عروسک",price:250000,emoji:"🧸"},
{id:6,name:"عینک آفتابی",price:310000,emoji:"🕶️"}
];

let products=JSON.parse(localStorage.getItem("atefehProducts"))||defaultProducts;
let cart=[];
let orders=JSON.parse(localStorage.getItem("atefehOrders"))||[];

function save(){
localStorage.setItem("atefehProducts",JSON.stringify(products));
localStorage.setItem("atefehOrders",JSON.stringify(orders));
}

function show(id){
document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
if(id==="cart")renderCart();
if(id==="admin")renderAdmin();
}

function money(n){return Number(n).toLocaleString("fa-IR")+" تومان"}

function render(){
let q=document.getElementById("search").value.trim();
let list=products.filter(p=>p.name.includes(q));
document.getElementById("products").innerHTML=list.map(p=>`
<div class="card">
<div class="pic">${p.emoji||"📦"}</div>
<h3>${p.name}</h3>
<div class="price">${money(p.price)}</div>
<button onclick="addCart(${p.id})">افزودن به سبد خرید</button>
</div>`).join("")||"محصولی پیدا نشد";
}

function addCart(id){
cart.push(id);
document.getElementById("count").textContent=cart.length.toLocaleString("fa-IR");
alert("محصول به سبد خرید اضافه شد 💜");
}

function renderCart(){
let html=cart.map((id,i)=>{
let p=products.find(x=>x.id===id);
return p?`<div class="item">${p.emoji} ${p.name} - ${money(p.price)}
<button class="danger" onclick="removeCart(${i})">حذف</button></div>`:"";
}).join("");
document.getElementById("cartItems").innerHTML=html||"سبد خرید خالی است.";
let total=cart.reduce((s,id)=>s+(products.find(p=>p.id===id)?.price||0),0);
document.getElementById("total").textContent="مبلغ کل: "+money(total);
}

function removeCart(i){
cart.splice(i,1);
document.getElementById("count").textContent=cart.length.toLocaleString("fa-IR");
renderCart();
}

function order(){
let name=document.getElementById("customer").value.trim();
let phone=document.getElementById("phone").value.trim();
let address=document.getElementById("address").value.trim();
if(!cart.length)return alert("سبد خرید خالی است");
if(!name||!phone||!address)return alert("لطفاً اطلاعات سفارش را کامل کن");
let items=cart.map(id=>products.find(p=>p.id===id)).filter(Boolean);
let total=items.reduce((s,p)=>s+p.price,0);
orders.push({name,phone,address,items,total,date:new Date().toLocaleString("fa-IR")});
save();
cart=[];
document.getElementById("count").textContent="۰";
alert("سفارش شما ثبت شد 💜");
show("home");
}

function login(){
if(document.getElementById("pass").value==="mrhaji.IR1"){
show("admin");
}else{
document.getElementById("error").textContent="رمز اشتباه است!";
}
}

function logout(){show("home")}

function addProduct(){
let name=document.getElementById("pname").value.trim();
let price=Number(document.getElementById("pprice").value);
let emoji=document.getElementById("pemoji").value.trim()||"📦";
if(!name||price<=0)return alert("نام و قیمت درست وارد کن");
products.push({id:Date.now(),name,price,emoji});
save();
document.getElementById("pname").value="";
document.getElementById("pprice").value="";
document.getElementById("pemoji").value="";
render();
renderAdmin();
alert("محصول اضافه شد");
}

function deleteProduct(id){
if(!confirm("این محصول حذف شود؟"))return;
products=products.filter(p=>p.id!==id);
save();render();renderAdmin();
}

function renderAdmin(){
document.getElementById("adminProducts").innerHTML=products.map(p=>`
<div class="item">${p.emoji} ${p.name} - ${money(p.price)}
<button class="danger" onclick="deleteProduct(${p.id})">حذف</button></div>`).join("");
document.getElementById("orders").innerHTML=orders.map(o=>`
<div class="item">
<strong>${o.name}</strong><br>
تلفن: ${o.phone}<br>
آدرس: ${o.address}<br>
محصولات: ${o.items.map(p=>p.name).join("، ")}<br>
مبلغ: ${money(o.total)}<br>
زمان: ${o.date}
</div>`).join("")||"هنوز سفارشی ثبت نشده است.";
}
render();
</script>
</body>
</html>
