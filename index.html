
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فروشگاه عاطفه</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma;background:#f8f4ff;color:#29213b}
header{background:#7139b7;color:white;text-align:center;padding:25px}
header h1{margin:0}
.hero{text-align:center;padding:45px 15px;background:#eadcff}
button{background:#7139b7;color:white;border:0;padding:12px 18px;border-radius:10px;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px;padding:20px}
.card{background:white;padding:12px;border-radius:15px;text-align:center}
.card img{width:100%;height:130px;object-fit:cover;border-radius:10px}
.price{color:#7139b7;font-weight:bold}
#cart{background:white;margin:20px;padding:20px;border-radius:15px}
footer{background:#7139b7;color:white;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
<h1>🛍️ فروشگاه عاطفه</h1>
<p>خرید آسان، انتخاب زیبا 💜</p>
</header>
<section class="hero">
<h2>به فروشگاه عاطفه خوش آمدید</h2>
<p>محصولات متنوع با قیمت مناسب</p>
<button onclick="document.getElementById('products').scrollIntoView()">مشاهده محصولات</button>
</section>
<h2 style="text-align:center">✨ محصولات ما</h2>
<div class="products" id="products"></div>
<section id="cart">
<h2>🛒 سبد خرید</h2>
<div id="items">سبد خرید خالی است.</div>
<h3 id="total">مجموع: ۰ تومان</h3>
<button onclick="order()">ثبت سفارش</button>
</section>
<footer>فروشگاه عاطفه 💜</footer>
<script>
const products=[
{name:"کیف زیبا",price:450000,img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500"},
{name:"ساعت شیک",price:650000,img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"},
{name:"کفش اسپرت",price:850000,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{name:"عینک آفتابی",price:250000,img:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500"}
];
let cart=[];
function render(){
document.getElementById("products").innerHTML=products.map((p,i)=>`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<p class="price">${p.price.toLocaleString("fa-IR")} تومان</p>
<button onclick="add(${i})">افزودن به سبد</button>
</div>`).join("");
}
function add(i){cart.push(products[i]);showCart()}
function showCart(){
document.getElementById("items").innerHTML=cart.length?
cart.map((p,i)=>`<p>${p.name} - ${p.price.toLocaleString("fa-IR")} تومان <button onclick="removeItem(${i})">حذف</button></p>`).join(""):"سبد خرید خالی است.";
let sum=cart.reduce((s,p)=>s+p.price,0);
document.getElementById("total").innerText="مجموع: "+sum.toLocaleString("fa-IR")+" تومان";
}
function removeItem(i){cart.splice(i,1);showCart()}
function order(){
if(!cart.length)return alert("سبد خرید خالی است!");
let msg="سلام، سفارش از فروشگاه عاطفه:\n"+cart.map(p=>p.name).join("\n")+"\nمجموع: "+cart.reduce((s,p)=>s+p.price,0)+" تومان";
alert("سفارش شما آماده است:\n"+msg+"\nلطفاً با فروشگاه تماس بگیرید.");
}
render();
</script>
</body>
</html>
